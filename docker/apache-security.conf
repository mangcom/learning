# Never serve the git metadata or deployment/config files through the web
<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "/\.github">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(docker-compose\.ya?ml|Dockerfile|\.dockerignore|\.env(\.example)?|\.gitignore)$">
    Require all denied
</FilesMatch>

<Directory "/var/www/html">
    AllowOverride All
    Require all granted
</Directory>
