<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Sarabun, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="820" height="450" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Asynchronous: สั่งแล้วไม่ต้องยืนรอ และ Promise คือ "ใบรับคิว"</text>

  <!-- timeline sync vs async -->
  <text x="30" y="66" font-size="14" font-weight="bold" fill="#991b1b">Synchronous (รอทีละงาน)</text>
  <g font-size="12" text-anchor="middle" fill="#ffffff">
    <rect x="230" y="50" width="110" height="26" rx="5" fill="#64748b"/><text x="285" y="68">สั่งอาหาร</text>
    <rect x="340" y="50" width="250" height="26" rx="5" fill="#ef4444"/><text x="465" y="68">ยืนรอเฉย ๆ (หน้าเว็บค้าง)</text>
    <rect x="590" y="50" width="100" height="26" rx="5" fill="#64748b"/><text x="640" y="68">ได้อาหาร</text>
    <rect x="690" y="50" width="110" height="26" rx="5" fill="#64748b"/><text x="745" y="68">ทำงานอื่น</text>
  </g>
  <text x="30" y="110" font-size="14" font-weight="bold" fill="#065f46">Asynchronous (ไม่ต้องรอ)</text>
  <g font-size="12" text-anchor="middle" fill="#ffffff">
    <rect x="230" y="94" width="110" height="26" rx="5" fill="#64748b"/><text x="285" y="112">สั่งอาหาร</text>
    <rect x="340" y="94" width="250" height="26" rx="5" fill="#10b981"/><text x="465" y="112">ทำงานอื่นไปก่อน (หน้าเว็บใช้ได้)</text>
    <rect x="590" y="94" width="100" height="26" rx="5" fill="#64748b"/><text x="640" y="112">ได้อาหาร</text>
  </g>
  <path d="M340,128 C400,150 560,150 588,128" stroke="#10b981" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="465" y="160" text-anchor="middle" font-size="11.5" fill="#065f46">ร้านทำอาหารคู่ขนาน (เช่น เซิร์ฟเวอร์ส่งข้อมูลกลับมา)</text>

  <!-- promise states -->
  <rect x="15" y="176" width="390" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="210" y="200" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">สถานะของ Promise</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="35" y="220" width="130" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="100" y="243" font-weight="bold" fill="#713f12">⏳ pending</text>
    <text x="100" y="263" fill="#713f12">กำลังรอผล</text>
    <rect x="245" y="214" width="145" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="317" y="237" font-weight="bold" fill="#14532d">✔ fulfilled</text>
    <text x="317" y="257" fill="#14532d">สำเร็จ → resolve(ค่า)</text>
    <rect x="245" y="284" width="145" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="317" y="307" font-weight="bold" fill="#7f1d1d">✖ rejected</text>
    <text x="317" y="327" fill="#7f1d1d">ล้มเหลว → reject(Error)</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M167,240 L241,240"/>
    <path d="M167,258 C205,258 205,310 241,310"/>
  </g>
  <g font-size="12" fill="#334155">
    <text x="35" y="370">await รอค่าจาก fulfilled · catch รับ Error จาก rejected</text>
    <text x="35" y="392">Promise เหมือนใบรับคิวร้านอาหาร: ได้ใบทันที</text>
    <text x="35" y="410">แต่อาหาร (ผลลัพธ์) จะมาทีหลัง หรืออาจได้แจ้งว่าหมด</text>
  </g>

  <!-- async await mapping -->
  <rect x="420" y="176" width="385" height="260" rx="10" fill="#0f172a"/>
  <text x="612" y="200" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">async / await ในปฏิบัติการของหน่วยนี้</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <text x="436" y="228" fill="#c4b5fd">async function <tspan fill="#fde68a">loadStudents</tspan>() {</text>
    <text x="452" y="250" fill="#e2e8f0">setLoading(true);</text>
    <text x="452" y="272" fill="#e2e8f0">try {</text>
    <text x="468" y="294" fill="#86efac">const res = <tspan fill="#f472b6">await</tspan> fetch("/api/...");</text>
    <text x="468" y="316" fill="#86efac">const data = <tspan fill="#f472b6">await</tspan> res.json();</text>
    <text x="468" y="338" fill="#e2e8f0">setStudents(data);</text>
    <text x="452" y="360" fill="#fca5a5">} catch (err) { setError(err.message); }</text>
    <text x="452" y="382" fill="#93c5fd">finally { setLoading(false); }</text>
    <text x="436" y="404" fill="#c4b5fd">}</text>
  </g>
  <text x="612" y="426" text-anchor="middle" font-size="11.5" fill="#94a3b8">ระหว่าง await หน้าเว็บยังใช้งานได้ และแสดงคำว่า "กำลังโหลด..."</text>
</svg>
