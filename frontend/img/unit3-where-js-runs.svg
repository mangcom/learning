<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Sarabun, sans-serif">
  <rect width="820" height="440" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">JavaScript ทำงานได้ 2 ที่ และ console.log() แสดงผลคนละที่</text>

  <!-- center badge -->
  <rect x="370" y="150" width="80" height="80" rx="10" fill="#facc15"/>
  <text x="430" y="218" text-anchor="end" font-size="34" font-weight="bold" fill="#0f172a" font-family="Arial, sans-serif">JS</text>
  <text x="410" y="252" text-anchor="middle" font-size="12" fill="#475569">ภาษาเดียวกัน</text>

  <!-- Browser -->
  <rect x="20" y="52" width="330" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">🌐 ในเบราว์เซอร์ (Browser)</text>
  <g font-size="12.5" fill="#1e3a8a">
    <rect x="36" y="94" width="298" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="48" y="116" font-weight="bold">ควบคุมหน้าเว็บ (DOM) และรับ Event</text>
    <text x="48" y="136">คลิกปุ่ม · พิมพ์ในช่องกรอก · เลื่อนหน้า</text>
    <rect x="36" y="156" width="298" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="48" y="178" font-weight="bold">Client Component ของ Next.js</text>
    <text x="48" y="198">ไฟล์ที่ขึ้นต้นด้วย "use client"</text>
    <rect x="36" y="218" width="298" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="48" y="240" font-weight="bold">ปุ่ม ▶ รันโค้ด ในบทเรียนนี้</text>
    <text x="48" y="260">ทดลองแก้โค้ดและดูผลได้ทันที</text>
  </g>
  <rect x="36" y="282" width="298" height="46" rx="8" fill="#1e3a8a"/>
  <text x="185" y="302" text-anchor="middle" font-size="12.5" fill="#bfdbfe">console.log() แสดงที่</text>
  <text x="185" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">F12 → แท็บ Console</text>

  <!-- Node -->
  <rect x="470" y="52" width="330" height="290" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="635" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">🐳 ใน Node.js (Docker Container)</text>
  <g font-size="12.5" fill="#065f46">
    <rect x="486" y="94" width="298" height="54" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="498" y="116" font-weight="bold">รันไฟล์ .mjs ฝึกเขียนโปรแกรม</text>
    <text x="498" y="136" font-family="Consolas, monospace" font-size="11.5">docker compose exec app node ไฟล์.mjs</text>
    <rect x="486" y="156" width="298" height="54" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="498" y="178" font-weight="bold">Server Component และ Route Handler</text>
    <text x="498" y="198">เช่น app/page.js, app/api/.../route.js</text>
    <rect x="486" y="218" width="298" height="54" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="498" y="240" font-weight="bold">อ่านไฟล์ / เชื่อมฐานข้อมูล / เรียก API</text>
    <text x="498" y="260">ไม่มีหน้าเว็บ (ไม่มี DOM, ไม่มีปุ่มให้คลิก)</text>
  </g>
  <rect x="486" y="282" width="298" height="46" rx="8" fill="#065f46"/>
  <text x="635" y="302" text-anchor="middle" font-size="12.5" fill="#a7f3d0">console.log() แสดงที่</text>
  <text x="635" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Terminal / docker compose logs</text>

  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4">
    <line x1="352" y1="190" x2="368" y2="190"/>
    <line x1="452" y1="190" x2="468" y2="190"/>
  </g>

  <rect x="20" y="356" width="780" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="410" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">💡 หา console.log() ไม่เจอ? ให้ถามตัวเองว่า "โค้ดบรรทัดนี้ทำงานที่ไหน"</text>
  <text x="410" y="406" text-anchor="middle" font-size="12.5" fill="#78350f">โค้ดใน Client Component ดูที่ F12 Console · โค้ดฝั่งเซิร์ฟเวอร์ดูที่ Terminal ที่รัน docker compose logs -f app</text>
</svg>
