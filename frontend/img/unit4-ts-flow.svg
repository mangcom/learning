<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Sarabun, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="420" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">TypeScript ทำงานอย่างไร: ตรวจ Type ก่อน แล้วเหลือแค่ JavaScript ตอนรันจริง</text>

  <!-- source -->
  <rect x="20" y="60" width="230" height="150" rx="10" fill="#0f172a"/>
  <text x="34" y="84" font-size="12" font-weight="bold" fill="#93c5fd">📄 student.ts (TypeScript)</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <text x="34" y="110" fill="#c4b5fd">interface <tspan fill="#fde68a">Student</tspan> {</text>
    <text x="48" y="128" fill="#e2e8f0">name: <tspan fill="#67e8f9">string</tspan>;</text>
    <text x="48" y="146" fill="#e2e8f0">score: <tspan fill="#67e8f9">number</tspan>;</text>
    <text x="34" y="164" fill="#c4b5fd">}</text>
    <text x="34" y="190" fill="#e2e8f0">const s: Student = {...};</text>
  </g>

  <line x1="252" y1="135" x2="296" y2="135" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- checker -->
  <rect x="300" y="90" width="200" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">ตรวจ Type</text>
  <text x="400" y="142" text-anchor="middle" font-size="12" fill="#1e3a8a">tsc / VS Code / next build</text>
  <text x="400" y="162" text-anchor="middle" font-size="12" fill="#1e3a8a">ตรวจ "ก่อน" โปรแกรมทำงาน</text>

  <!-- error branch -->
  <path d="M400,182 L400,236" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="410" y="214" font-size="12" font-weight="bold" fill="#dc2626">พบ Error</text>
  <rect x="290" y="240" width="220" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">❌ แจ้งตำแหน่งผิดทันที</text>
  <text x="400" y="284" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#991b1b">Type 'string' is not assignable</text>
  <text x="400" y="300" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#991b1b">to type 'number'.</text>
  <path d="M290,280 C200,280 135,260 135,214" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="150" y="300" font-size="12" fill="#991b1b">แก้โค้ดแล้วตรวจใหม่</text>

  <!-- ok branch -->
  <line x1="502" y1="135" x2="546" y2="135" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="504" y="125" font-size="12" font-weight="bold" fill="#16a34a">ผ่าน</text>
  <rect x="550" y="60" width="250" height="150" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="564" y="84" font-size="12" font-weight="bold" fill="#713f12">📄 JavaScript (ตัด Type ทิ้ง)</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#713f12">
    <text x="564" y="112">const s = {</text>
    <text x="578" y="130">name: "สมชาย",</text>
    <text x="578" y="148">score: 85</text>
    <text x="564" y="166">};</text>
  </g>
  <text x="564" y="194" font-size="11.5" fill="#92400e">interface และ : number หายไปหมด</text>

  <line x1="675" y1="212" x2="675" y2="256" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="560" y="260" width="230" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="675" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">▶ รันได้ทุกที่ที่รัน JS ได้</text>
  <text x="675" y="304" text-anchor="middle" font-size="12" fill="#14532d">เบราว์เซอร์ · Node.js · Next.js</text>

  <rect x="20" y="342" width="780" height="62" rx="10" fill="#f1f5f9"/>
  <text x="410" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">💡 Type มีอยู่เฉพาะตอนเขียนและตอนตรวจ (Type Erasure) — เบราว์เซอร์ไม่รู้จัก TypeScript เลย</text>
  <text x="410" y="390" text-anchor="middle" font-size="12.5" fill="#334155">ถ้าข้ามขั้นตรวจ Type (เช่น รันด้วย tsx) โค้ดที่ผิดชนิดก็ยังรันได้ และอาจให้ผลลัพธ์ผิดโดยไม่รู้ตัว</text>
</svg>
