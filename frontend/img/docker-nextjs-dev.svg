<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Sarabun, sans-serif">
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="820" height="470" rx="12" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">พัฒนา Next.js ด้วย Docker: เครื่อง Windows ทำงานร่วมกับ Container อย่างไร</text>

  <!-- ===== Host ===== -->
  <rect x="15" y="46" width="380" height="345" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="205" y="70" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">💻 เครื่อง Windows ของนักศึกษา (Host)</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="32" y="84" width="165" height="66" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="114" y="108" font-weight="bold" fill="#1e3a8a">✏ VS Code</text>
    <text x="114" y="130" fill="#334155">เปิดและแก้ไขโค้ด</text>

    <rect x="213" y="84" width="165" height="66" rx="8" fill="#ffffff" stroke="#f97316"/>
    <text x="295" y="108" font-weight="bold" fill="#9a3412">🔀 Git for Windows</text>
    <text x="295" y="130" fill="#334155">commit / push ขึ้น GitHub</text>

    <rect x="32" y="168" width="346" height="96" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="205" y="192" font-weight="bold" fill="#713f12">📁 โฟลเดอร์โปรเจกต์ first-nextjs-app</text>
    <text x="205" y="215" font-family="Consolas, monospace" font-size="12" fill="#713f12">app/  public/  package.json  docker-compose.yml</text>
    <text x="205" y="240" fill="#713f12">โค้ดตัวจริงเก็บอยู่บนเครื่องของเรา</text>

    <rect x="32" y="290" width="165" height="80" rx="8" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="114" y="316" font-weight="bold" fill="#0369a1">🐳 Docker Desktop</text>
    <text x="114" y="338" fill="#334155">รับคำสั่ง</text>
    <text x="114" y="356" font-family="Consolas, monospace" font-size="11.5" fill="#334155">docker compose up</text>

    <rect x="213" y="290" width="165" height="80" rx="8" fill="#ffffff" stroke="#10b981"/>
    <text x="295" y="316" font-weight="bold" fill="#065f46">🌐 เบราว์เซอร์</text>
    <text x="295" y="340" font-family="Consolas, monospace" font-size="12" fill="#334155">localhost:3000</text>
    <text x="295" y="360" fill="#334155">ดูผลลัพธ์หน้าเว็บ</text>
  </g>

  <!-- ===== Container ===== -->
  <rect x="455" y="46" width="350" height="345" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="630" y="70" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#075985">🐳 Docker Container (service: app)</text>
  <text x="630" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">image: node:22-alpine (Linux + Node.js 22)</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="472" y="100" width="316" height="54" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="630" y="122" font-weight="bold" fill="#5b21b6">📦 /app/node_modules (Volume แยก)</text>
    <text x="630" y="143" fill="#334155">แพ็กเกจที่ติดตั้งสำหรับ Linux เก็บแยกไว้</text>

    <rect x="472" y="168" width="316" height="96" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="630" y="192" font-weight="bold" fill="#713f12">📁 /app</text>
    <text x="630" y="215" fill="#713f12">เห็นไฟล์ชุดเดียวกับโฟลเดอร์บน Windows</text>
    <text x="630" y="240" fill="#713f12">(ไม่ได้คัดลอก แต่ "แชร์" ไฟล์กันโดยตรง)</text>

    <rect x="472" y="290" width="316" height="80" rx="8" fill="#0f172a"/>
    <text x="630" y="316" font-weight="bold" fill="#ffffff">▲ Next.js Dev Server</text>
    <text x="630" y="338" font-family="Consolas, monospace" font-size="12" fill="#93c5fd">npm run dev</text>
    <text x="630" y="358" fill="#cbd5e1">ทำงานที่พอร์ต 3000 ภายใน Container</text>
  </g>

  <!-- connectors -->
  <g stroke="#0f172a" stroke-width="2.5" fill="none" marker-start="url(#e)" marker-end="url(#e)">
    <line x1="382" y1="216" x2="466" y2="216"/>
    <line x1="382" y1="330" x2="466" y2="330"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    <rect x="388" y="180" width="72" height="22" rx="5" fill="#ffffff" stroke="#0f172a"/>
    <text x="424" y="195">Bind Mount</text>
    <text x="424" y="240" font-family="Consolas, monospace" font-weight="normal">.:/app</text>
    <rect x="388" y="294" width="72" height="22" rx="5" fill="#ffffff" stroke="#0f172a"/>
    <text x="424" y="309">Port</text>
    <text x="424" y="354" font-family="Consolas, monospace" font-weight="normal">3000:3000</text>
  </g>

  <rect x="15" y="404" width="790" height="54" rx="10" fill="#0f172a"/>
  <text x="410" y="426" text-anchor="middle" font-size="12.5" fill="#e2e8f0">แก้โค้ดใน VS Code บน Windows → ไฟล์ถูกแชร์เข้า Container ผ่าน Bind Mount</text>
  <text x="410" y="446" text-anchor="middle" font-size="12.5" fill="#e2e8f0">→ Next.js ใน Container สร้างหน้าเว็บใหม่ (Hot Reload) → เบราว์เซอร์เห็นผลทันทีที่ localhost:3000</text>
</svg>
