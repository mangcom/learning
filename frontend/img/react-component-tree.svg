<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Sarabun, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="820" height="420" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">แนวคิด Component ของ React: ประกอบหน้าเว็บจากชิ้นส่วนย่อย</text>

  <!-- ===== Left: component tree ===== -->
  <text x="235" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">โครงสร้าง Component (Component Tree)</text>

  <g font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="175" y="82" width="120" height="40" rx="8" fill="#0f172a"/>
    <text x="235" y="107" fill="#ffffff">&lt;App /&gt;</text>

    <rect x="25" y="182" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="85" y="207" fill="#1e3a8a">&lt;Header /&gt;</text>

    <rect x="170" y="182" width="130" height="40" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="235" y="207" fill="#065f46">&lt;ProductList /&gt;</text>

    <rect x="325" y="182" width="120" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="385" y="207" fill="#78350f">&lt;Footer /&gt;</text>

    <rect x="50" y="292" width="118" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="109" y="317" fill="#065f46" font-size="12">&lt;ProductCard /&gt;</text>
    <rect x="176" y="292" width="118" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="235" y="317" fill="#065f46" font-size="12">&lt;ProductCard /&gt;</text>
    <rect x="302" y="292" width="118" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="361" y="317" fill="#065f46" font-size="12">&lt;ProductCard /&gt;</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M215,122 L95,180"/>
    <path d="M235,122 L235,180"/>
    <path d="M255,122 L375,180"/>
    <path d="M215,222 L115,290"/>
    <path d="M235,222 L235,290"/>
    <path d="M255,222 L355,290"/>
  </g>
  <g font-size="12" fill="#64748b" font-style="italic">
    <text x="128" y="148">props</text>
    <text x="242" y="158">props</text>
    <text x="316" y="148">props</text>
    <text x="150" y="252" text-anchor="end">props: ชื่อสินค้า, ราคา</text>
  </g>

  <rect x="25" y="355" width="420" height="44" rx="8" fill="#f1f5f9"/>
  <text x="235" y="374" text-anchor="middle" font-size="12.5" fill="#334155">ข้อมูลไหลจากบนลงล่างผ่าน props (One-way Data Flow)</text>
  <text x="235" y="391" text-anchor="middle" font-size="12.5" fill="#334155">เขียน &lt;ProductCard /&gt; ครั้งเดียว นำกลับมาใช้ซ้ำได้หลายครั้ง</text>

  <!-- ===== Right: what the user sees ===== -->
  <text x="640" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">สิ่งที่ผู้ใช้เห็นบนหน้าเว็บ</text>
  <rect x="490" y="80" width="300" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="506" cy="94" r="4" fill="#ef4444"/><circle cx="519" cy="94" r="4" fill="#f59e0b"/><circle cx="532" cy="94" r="4" fill="#10b981"/>

  <rect x="505" y="108" width="270" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="135" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="bold">Header: โลโก้ + เมนู</text>

  <rect x="505" y="164" width="270" height="168" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="184" text-anchor="middle" font-size="12" fill="#065f46" font-weight="bold">ProductList</text>
  <g font-size="11" text-anchor="middle" fill="#065f46">
    <rect x="515" y="194" width="78" height="126" rx="5" fill="#ffffff" stroke="#10b981" stroke-dasharray="4 3"/>
    <rect x="523" y="202" width="62" height="50" rx="3" fill="#a7f3d0"/>
    <text x="554" y="272">คีย์บอร์ด</text><text x="554" y="290">฿1,290</text>
    <rect x="601" y="194" width="78" height="126" rx="5" fill="#ffffff" stroke="#10b981" stroke-dasharray="4 3"/>
    <rect x="609" y="202" width="62" height="50" rx="3" fill="#a7f3d0"/>
    <text x="640" y="272">เมาส์</text><text x="640" y="290">฿590</text>
    <rect x="687" y="194" width="78" height="126" rx="5" fill="#ffffff" stroke="#10b981" stroke-dasharray="4 3"/>
    <rect x="695" y="202" width="62" height="50" rx="3" fill="#a7f3d0"/>
    <text x="726" y="272">หูฟัง</text><text x="726" y="290">฿890</text>
  </g>

  <rect x="505" y="342" width="270" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="369" text-anchor="middle" font-size="13" fill="#78350f" font-weight="bold">Footer: ข้อมูลติดต่อ</text>
</svg>
