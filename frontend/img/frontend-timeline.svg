<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Sarabun, sans-serif">
  <rect width="800" height="330" rx="12" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">วิวัฒนาการของเทคโนโลยี Front-End และเครื่องมือที่เกี่ยวข้อง</text>

