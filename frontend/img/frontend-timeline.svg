  <g font-size="12" fill="#334155">
    <circle cx="70" cy="292" r="7" fill="#2563eb"/><text x="83" y="296">ภาษาพื้นฐานของเว็บ</text>
    <circle cx="225" cy="292" r="7" fill="#f59e0b"/><text x="238" y="296">ไลบรารี/เฟรมเวิร์ก JavaScript</text>
    <circle cx="420" cy="292" r="7" fill="#10b981"/><text x="433" y="296">เครื่องมือของนักพัฒนา</text>
    <circle cx="580" cy="292" r="7" fill="#0ea5e9"/><text x="593" y="296">React</text>
    <circle cx="655" cy="292" r="7" fill="#0f172a"/><text x="668" y="296">Next.js</text>
