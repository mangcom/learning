<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', Sarabun, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="820" height="440" rx="12" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">ปัญหาชื่อคลาสชนกัน และวิธีที่ Next.js ใช้แก้ไข</text>

  <!-- Global -->
  <rect x="15" y="50" width="255" height="375" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="142" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">① Global CSS อย่างเดียว</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <rect x="30" y="90" width="225" height="58" rx="6" fill="#ffffff" stroke="#f87171"/>
    <text x="40" y="110" fill="#64748b">/* Footer เขียนไว้ */</text>
    <text x="40" y="132" fill="#991b1b">.title { color: white; }</text>
    <rect x="30" y="158" width="225" height="58" rx="6" fill="#ffffff" stroke="#f87171"/>
    <text x="40" y="178" fill="#64748b">/* Card เขียนทีหลัง */</text>
    <text x="40" y="200" fill="#991b1b">.title { color: red; }</text>
  </g>
  <rect x="30" y="232" width="225" height="70" rx="6" fill="#991b1b"/>
  <text x="142" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">💥 ชื่อชนกัน!</text>
  <text x="142" y="282" text-anchor="middle" font-size="12" fill="#fecaca">หัวข้อใน Footer กลายเป็นสีแดง</text>
  <g font-size="12" fill="#991b1b">
    <text x="30" y="330">ทุกคลาสใช้ได้ทั้งเว็บ ตัวที่โหลด</text>
    <text x="30" y="350">ทีหลังจะทับตัวก่อนหน้า ยิ่งโปรเจกต์</text>
    <text x="30" y="370">ใหญ่ ยิ่งหาสาเหตุยาก</text>
    <text x="30" y="400" font-weight="bold">→ ใช้เฉพาะสไตล์พื้นฐานทั้งเว็บ</text>
  </g>

  <!-- CSS Modules -->
  <rect x="283" y="50" width="255" height="375" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="410" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">② CSS Modules</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <rect x="298" y="90" width="225" height="58" rx="6" fill="#ffffff" stroke="#60a5fa"/>
    <text x="308" y="110" fill="#64748b">/* Footer.module.css */</text>
    <text x="308" y="132" fill="#1e3a8a">.title { color: white; }</text>
    <rect x="298" y="158" width="225" height="58" rx="6" fill="#ffffff" stroke="#60a5fa"/>
    <text x="308" y="178" fill="#64748b">/* Card.module.css */</text>
    <text x="308" y="200" fill="#1e3a8a">.title { color: red; }</text>
  </g>
  <path d="M410,220 L410,238" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="298" y="242" width="225" height="62" rx="6" fill="#1e3a8a"/>
  <text x="410" y="262" text-anchor="middle" font-size="11.5" fill="#bfdbfe">Next.js เปลี่ยนชื่อให้ไม่ซ้ำอัตโนมัติ</text>
  <text x="410" y="280" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#ffffff">Footer_title__qtfT0</text>
  <text x="410" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#ffffff">Card_title__Xk82p</text>
  <g font-size="12" fill="#1e3a8a">
    <text x="298" y="330">ชื่อคลาสใช้ได้เฉพาะไฟล์ที่ import</text>
    <text x="298" y="350">ตั้งชื่อซ้ำกันข้ามไฟล์ได้อย่างปลอดภัย</text>
    <text x="298" y="370">เขียน CSS แบบปกติที่คุ้นเคย</text>
    <text x="298" y="400" font-weight="bold">→ สไตล์เฉพาะคอมโพเนนต์</text>
  </g>

  <!-- Tailwind -->
  <rect x="551" y="50" width="254" height="375" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="678" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#155e75">③ Tailwind CSS</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12">
    <rect x="566" y="90" width="224" height="126" rx="6" fill="#ffffff" stroke="#22d3ee"/>
    <text x="576" y="110" fill="#64748b">// เขียนสไตล์ใน className</text>
    <text x="576" y="134" fill="#155e75">&lt;h2 className=</text>
    <text x="586" y="154" fill="#0e7490">"text-xl font-bold</text>
    <text x="586" y="174" fill="#0e7490"> text-red-600"&gt;</text>
    <text x="576" y="198" fill="#155e75">&lt;/h2&gt;</text>
  </g>
  <rect x="566" y="232" width="224" height="72" rx="6" fill="#155e75"/>
  <text x="678" y="256" text-anchor="middle" font-size="12" fill="#cffafe">แต่ละคลาสทำหน้าที่เดียว</text>
  <text x="678" y="276" text-anchor="middle" font-size="12" fill="#cffafe">และให้ผลเหมือนเดิมทุกที่</text>
  <text x="678" y="295" text-anchor="middle" font-size="12" fill="#ffffff">ไม่มีการตั้งชื่อคลาสใหม่ = ไม่ชน</text>
  <g font-size="12" fill="#155e75">
    <text x="566" y="330">ไม่ต้องสลับไปมาระหว่างไฟล์</text>
    <text x="566" y="350">ใช้ระบบสี/ระยะห่างมาตรฐานเดียวกัน</text>
    <text x="566" y="370">ทำ Responsive ด้วย md: lg:</text>
    <text x="566" y="400" font-weight="bold">→ ออกแบบหน้าเว็บได้รวดเร็ว</text>
  </g>
</svg>
